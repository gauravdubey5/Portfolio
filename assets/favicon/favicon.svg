<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="50%" stop-color="#0078D4" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#060D1F" stroke="#00A3FF" stroke-width="1.5" />
  
  <!-- Outer orbital ring -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="#00F5FF" stroke-width="0.8" stroke-dasharray="4 3" opacity="0.6" />
  
  <!-- Cloudverse Icon -->
  <path d="M46 38c3.3 0 6-2.7 6-6 0-3-2.2-5.5-5.1-5.9C45.7 20.8 40.4 17 34 17c-6.8 0-12.4 4.3-14.4 10.4C16.2 27.9 14 30.7 14 34c0 3.9 3.1 7 7 7h25c3.3 0 6-2.7 6-6z" 
        fill="none" stroke="url(#cloudGrad)" stroke-width="2.5" filter="url(#glow)" />
  
  <!-- Center tech node -->
  <circle cx="32" cy="32" r="3" fill="#00F5FF" />
  <circle cx="24" cy="34" r="2" fill="#7C3AED" />
  <circle cx="40" cy="32" r="2" fill="#0078D4" />
  <line x1="24" y1="34" x2="32" y2="32" stroke="#00F5FF" stroke-width="1.2" opacity="0.8" />
  <line x1="32" y1="32" x2="40" y2="32" stroke="#00F5FF" stroke-width="1.2" opacity="0.8" />
</svg>
